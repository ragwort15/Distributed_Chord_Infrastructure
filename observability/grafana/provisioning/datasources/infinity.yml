apiVersion: 1

datasources:
  - name: ChordAPI
    type: yesoreyeram-infinity-datasource
    uid: infinity-chord
    access: proxy
    # Uses Docker container name — works on chord-network locally and in cloud
    url: http://chord-node-1:5000
    isDefault: false
    editable: false
    jsonData:
      allowed_hosts:
        - http://chord-node-1:5000
        - http://chord-node-2:5000
        - http://chord-node-3:5000
