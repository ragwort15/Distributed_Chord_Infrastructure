global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Local dev: chord nodes running natively on the host (not in Docker).
  - job_name: "chord-nodes-local"
    metrics_path: "/prom_metrics"
    static_configs:
      - targets:
          - "host.docker.internal:5005"
          - "host.docker.internal:5006"
          - "host.docker.internal:5007"
        labels:
          env: "local"

  # Docker-compose deployment — uncomment when nodes run in containers.
  # - job_name: "chord-nodes"
