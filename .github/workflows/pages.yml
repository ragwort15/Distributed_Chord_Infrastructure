name: Deploy presentation to GitHub Pages

# Publishes chord/static/presentation/ as a static site whenever main moves.
# Manual triggers also supported via the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "chord/static/presentation/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow only one concurrent Pages deploy; queue newer commits.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload presentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: chord/static/presentation

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
